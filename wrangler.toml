name = "digital-bookshelf"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "digital-bookshelf"
database_id = "ec00574d-7d66-4b12-b8b6-769099f6c4cb"

# Environment variables (set via wrangler secret put)
# SYNC_SECRET = "your-64-char-hex-token"  # Generate with: npm run sync:token

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"